title: PowerShell Encoded Command Execution
id: 3c645245-6c05-4adb-ae93-ccd25f03bfdc
status: experimental

logsource:
  product: windows
  category: process_creation

detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains: '-EncodedCommand'

  condition: selection

falsepositives:
  - Legitimate scripts or tools using encoded PowerShell

level: medium